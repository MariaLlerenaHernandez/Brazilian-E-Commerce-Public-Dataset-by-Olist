# PostgreSQL 16 + Adminer para el Data Mart Olist
# Iniciar:  docker compose up -d
# Adminer:  http://localhost:8080  (Sistema: PostgreSQL, Servidor: postgres)
services:
  postgres:
    image: postgres:16
    container_name: bi-postgres
    environment:
      POSTGRES_DB: bi_database
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_user -d bi_database"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: bi-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
